# Optional blueprint only. Nothing is provisioned until explicitly deployed.
services:
  - type: web
    name: autonexa-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend
    startCommand: node backend/server.cjs
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
